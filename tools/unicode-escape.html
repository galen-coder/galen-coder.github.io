<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线 Unicode 转义工具：中文与 \\uXXXX 互转，支持 emoji 代理对、十六进制大小写，全部在浏览器本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="Unicode 转义 | Galen Coder Text Tools">
    <meta property="og:description" content="中文与 \\uXXXX 互转，支持 emoji，数据不上传。">
    <meta property="og:type" content="website">
    <title>Unicode 转义 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; unicode --escape</p>
        <h1>Unicode 转义</h1>
        <p>在中文与 <code>\uXXXX</code> 之间互转，emoji 会写成代理对，支持十六进制大小写。全部处理在浏览器本地完成。</p>
      </div>

      <section class="editor" aria-label="Unicode 转义">
        <div class="editor-toolbar">
          <div class="toolbar-actions">
            <label>
              模式
              <select id="mode">
                <option value="auto">自动识别</option>
                <option value="escape">转义</option>
                <option value="unescape">还原</option>
              </select>
            </label>
            <label><input id="upper" type="checkbox"> 大写十六进制</label>
            <label><input id="non-ascii-only" type="checkbox" checked> 仅转义非 ASCII</label>
          </div>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">执行</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入文本或 Unicode 转义</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="粘贴中文、emoji 或 \uXXXX 转义文本"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>输出</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">输入后自动判断转义或还原。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="unicode-escape.js"></script>
  </body>
</html>
