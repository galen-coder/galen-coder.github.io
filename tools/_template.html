<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="description" content="工具简介：一句话说明功能，全部在浏览器本地完成。">
    <meta name="theme-color" content="#ffffff">
    <meta property="og:title" content="工具名称 | Galen Coder Text Tools">
    <meta property="og:description" content="工具简介，数据不上传。">
    <meta property="og:type" content="website">
    <title>工具名称 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
    <style>
      /* 只放当前工具独有的样式，通用布局不要在这里重复。 */
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html" target="_blank" rel="noopener">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools" target="_blank" rel="noopener">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; 工具命令</p>
        <h1>工具名称</h1>
        <p>一句话说明这个工具做什么，并注明全部处理在浏览器本地完成，内容不会上传。</p>
      </div>

      <section class="editor" aria-label="工具名称">
        <div class="editor-toolbar">
          <span class="toolbar-hint">左侧输入，右侧输出</span>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">执行</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入内容</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="在这里粘贴内容"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>输出</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">等待输入。按 Cmd/Ctrl + Enter 执行。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="tool-name.js"></script>
  </body>
</html>
