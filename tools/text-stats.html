<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线文本统计工具：字符数、中文字符、英文单词、行数、段落数、UTF-8 字节与重复行分析，全部在浏览器本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="文本统计 | Galen Coder Text Tools">
    <meta property="og:description" content="字符、单词、行数与重复行分析，数据不上传。">
    <meta property="og:type" content="website">
    <title>文本统计 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; wc --detailed</p>
        <h1>文本统计</h1>
        <p>实时统计字符、中文字符、英文单词、行数、段落数与 UTF-8 字节，并列出重复最多的行。全部处理在浏览器本地完成。</p>
      </div>

      <section class="editor" aria-label="文本统计">
        <div class="editor-toolbar">
          <span class="toolbar-hint">输入时实时统计</span>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">统计</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入要统计的文本</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="粘贴要统计的文本"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>统计结果</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="统计结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">输入内容后自动统计。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="text-stats.js"></script>
  </body>
</html>
