<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Galen Coder 的浏览器文本工具集：格式化、编码转换、数据转换与文本处理，全部在本地运行。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="工具集 | Galen Coder Text Tools">
    <meta property="og:description" content="按分类浏览全部文本工具，数据不上传。">
    <meta property="og:type" content="website">
    <title>工具集 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
    <style>
      [hidden] {
        display: none !important;
      }

      .catalog-controls {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .search-field input {
        width: min(320px, 100%);
        padding: 6px 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--white);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 14px;
      }

      .search-field input::placeholder {
        color: var(--muted);
      }

      .search-field input:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 0;
      }

      .filter-chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .filter-chip {
        padding: 4px 10px;
        border: 1px solid var(--hairline);
        border-radius: var(--pill);
        background: var(--white);
        color: var(--muted);
        font-family: var(--sans);
        font-size: 13px;
        cursor: pointer;
        transition: background-color 150ms ease, color 150ms ease;
      }

      .filter-chip:hover {
        background: var(--hover);
      }

      .filter-chip.is-active {
        border-color: var(--ink);
        background: var(--ink);
        color: var(--white);
      }

      .catalog-count {
        margin-bottom: 12px;
        color: var(--muted);
        font-size: 13px;
      }

      .catalog-empty {
        padding: 24px;
        border: 1px dashed var(--hairline);
        border-radius: var(--radius);
        color: var(--muted);
        text-align: center;
      }
    </style>
  </head>
  <body data-root="..">
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回主页</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; ls ~/text-tools</p>
        <h1>工具集</h1>
        <p>按分类浏览全部工具，搜索名称或关键词即可筛选。所有处理都在浏览器本地完成，内容不会上传。</p>
      </div>

      <section aria-label="工具列表">
        <div class="catalog-controls">
          <label class="search-field">
            <span class="sr-only">搜索工具</span>
            <input id="tool-search" type="search" placeholder="搜索工具名称或关键词" autocomplete="off">
          </label>
          <div id="tool-filters" class="filter-chips" role="group" aria-label="按分类筛选"></div>
        </div>

        <p id="tool-count" class="catalog-count" role="status" aria-live="polite"></p>
        <div id="tool-catalog" class="tools-grid"></div>
        <p id="tool-empty" class="catalog-empty" hidden>没有匹配的工具，换个关键词试试。</p>
      </section>
    </main>

    <script src="../assets/tools-data.js"></script>
    <script src="../assets/tools-render.js"></script>
  </body>
</html>
