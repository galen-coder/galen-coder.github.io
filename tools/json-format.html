<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线 JSON 格式化工具：美化、压缩与校验 JSON，支持 2/4 空格和 Tab 缩进，全部在浏览器本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="JSON 格式化 | Galen Coder Text Tools">
    <meta property="og:description" content="美化、压缩与校验 JSON，数据不上传。">
    <meta property="og:type" content="website">
    <title>JSON 格式化 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
    <style>
      :root {
        --ink: #37352f;
        --paper: #f7f6f3;
        --white: #ffffff;
        --hover: #efedea;
        --active: #e3e1db;
        --hairline: #e9e7e4;
        --link: #2eaadc;
        --red: #eb5757;
        --muted: #787774;
        --sans: Inter, -apple-system, "Segoe UI", "PingFang SC", ui-sans-serif, sans-serif;
        --mono: "SFMono-Regular", "Cascadia Code", "Liberation Mono", Menlo, ui-monospace, monospace;
        --radius: 4px;
      }

      .pane-field,
      .pane-code {
        font-size: 14px;
      }

      .editor-toolbar label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
      }

      .editor-toolbar select {
        padding: 4px 8px;
        border: 1px solid var(--hairline);
        border-radius: var(--radius);
        background: var(--white);
        color: var(--ink);
        font-family: var(--sans);
        font-size: 13px;
        line-height: 1.4;
      }

      .editor-toolbar select:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      /* #2eaadc 在白底上对比度不足，键名改用更深的蓝色。 */
      #json-output .tok-key {
        color: #1a56db;
      }

      #json-output .tok-string {
        color: #448361;
      }

      #json-output .tok-number {
        color: #b76100;
      }

      #json-output .tok-literal {
        color: #9065b0;
      }

      #json-output .tok-punct {
        color: #9b9a97;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html" target="_blank" rel="noopener">
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools" target="_blank" rel="noopener">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; json --format</p>
        <h1>JSON 格式化</h1>
        <p>粘贴 JSON 后即可美化、压缩与校验。全部处理在浏览器本地完成，内容不会上传。</p>
      </div>

      <section class="editor" aria-label="JSON 格式化编辑器">
        <div class="editor-toolbar">
          <label for="indent">
            缩进
            <select id="indent">
              <option value="2">2 空格</option>
              <option value="4">4 空格</option>
              <option value="tab">Tab</option>
            </select>
          </label>
          <div class="toolbar-actions">
            <button id="format" class="button primary" type="button">格式化</button>
            <button id="minify" class="button secondary" type="button">压缩</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>input.json</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="json-input">输入 JSON</label>
            <textarea id="json-input" class="pane-field" spellcheck="false" placeholder='粘贴 JSON，例如：{"hello": "world"}'></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>output.json</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="json-output" class="pane-code" data-placeholder="格式化结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">等待输入。按 Cmd/Ctrl + Enter 快速格式化。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="json-format.js"></script>
  </body>
</html>
