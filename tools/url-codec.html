<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线 URL 编解码工具：encodeURIComponent、encodeURI 与解码互转，支持按行批量处理，全部在浏览器本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="URL 编解码 | Galen Coder Text Tools">
    <meta property="og:description" content="URL 编码与解码，支持按行批量处理，数据不上传。">
    <meta property="og:type" content="website">
    <title>URL 编解码 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; url --encode --decode</p>
        <h1>URL 编解码</h1>
        <p>在 encodeURIComponent、encodeURI 与解码之间转换，支持按行批量处理。无法转换的行会保留原内容。全部处理在浏览器本地完成。</p>
      </div>

      <section class="editor" aria-label="URL 编解码">
        <div class="editor-toolbar">
          <div class="toolbar-actions">
            <label>
              方式
              <select id="mode">
                <option value="component">encodeURIComponent</option>
                <option value="uri">encodeURI</option>
                <option value="decode">解码</option>
              </select>
            </label>
            <label><input id="per-line" type="checkbox" checked> 按行处理</label>
          </div>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">执行</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入 URL 或文本</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="粘贴 URL、参数值或已编码文本"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>输出</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">输入后自动转换。编码百分号时请谨慎，避免重复编码。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="url-codec.js"></script>
  </body>
</html>
