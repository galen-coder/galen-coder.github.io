<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线时间戳转换工具：Unix 秒级/毫秒级时间戳与日期互转，显示本地、UTC、上海与纽约时间，全部在浏览器本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="时间戳转换 | Galen Coder Text Tools">
    <meta property="og:description" content="Unix 时间戳与日期互转，多时区对照，数据不上传。">
    <meta property="og:type" content="website">
    <title>时间戳转换 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; date --timestamp</p>
        <h1>时间戳转换</h1>
        <p>自动识别 10 位秒级、13 位毫秒级时间戳，也接受日期字符串，输出多个时区的对照结果。全部处理在浏览器本地完成。</p>
      </div>

      <section class="editor" aria-label="时间戳转换">
        <div class="editor-toolbar">
          <span class="toolbar-hint">支持秒级、毫秒级与日期字符串</span>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">转换</button>
            <button id="now" class="button secondary" type="button">当前时间</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入时间戳或日期</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="例如 1700000000、1700000000000 或 2023-11-15 06:13:20"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>结果</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="换算结果会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">输入后点击转换，或按 Cmd/Ctrl + Enter。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="timestamp.js"></script>
  </body>
</html>
