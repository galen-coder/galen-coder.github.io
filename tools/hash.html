<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="在线哈希计算工具：MD5、SHA-1、SHA-256、SHA-384、SHA-512，支持文本与文件，输出十六进制和 Base64，全部在本地完成。">
    <meta name="theme-color" content="#f7f6f3">
    <meta property="og:title" content="哈希计算 | Galen Coder Text Tools">
    <meta property="og:description" content="MD5 与 SHA 系列摘要，数据不上传。">
    <meta property="og:type" content="website">
    <title>哈希计算 | Galen Coder Text Tools</title>
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../styles.css">
    <link rel="stylesheet" href="../assets/tool.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="tool-header">
      <a class="brand" href="../index.html">
        <span class="prompt-mark" aria-hidden="true">&gt;_</span>
        <span>galen-coder</span>
      </a>
      <a class="back-link" href="../index.html#tools">&larr; 返回工具箱</a>
    </header>

    <main id="main" class="tool-main">
      <div class="tool-intro">
        <p class="section-command" aria-hidden="true">&gt; hash --md5 --sha256</p>
        <h1>哈希计算</h1>
        <p>一次计算 MD5、SHA-1、SHA-256、SHA-384 与 SHA-512，支持文本和文件，输出十六进制与 Base64。全部处理在浏览器本地完成。</p>
      </div>

      <section class="editor" aria-label="哈希计算">
        <div class="editor-toolbar">
          <div class="toolbar-actions">
            <span class="toolbar-hint">MD5 为纯 JS 实现，SHA 系列使用 WebCrypto</span>
            <label class="button secondary file-button">
              选择文件
              <input id="file" type="file" hidden>
            </label>
          </div>
          <div class="toolbar-actions">
            <button id="run" class="button primary" type="button">计算</button>
            <button id="sample" class="button secondary" type="button">示例</button>
            <button id="clear" class="button secondary" type="button">清空</button>
          </div>
        </div>

        <div class="editor-grid">
          <div class="pane">
            <div class="pane-head">
              <span>输入</span>
              <span id="input-stats">0 字符</span>
            </div>
            <label class="sr-only" for="tool-input">输入要计算哈希的文本</label>
            <textarea id="tool-input" class="pane-field" spellcheck="false" placeholder="输入文本，或点击上方选择文件"></textarea>
          </div>
          <div class="pane">
            <div class="pane-head">
              <span>摘要</span>
              <span class="pane-actions">
                <span id="output-stats"></span>
                <button id="copy" type="button">复制</button>
              </span>
            </div>
            <pre id="tool-output" class="pane-code" data-placeholder="摘要会显示在这里" tabindex="0"></pre>
          </div>
        </div>

        <p id="status" class="status" data-tone="muted" role="status" aria-live="polite">输入文本后点击计算，或选择文件。按 Cmd/Ctrl + Enter 也可执行。</p>
      </section>
    </main>

    <script src="../assets/tool.js"></script>
    <script src="hash.js"></script>
  </body>
</html>
